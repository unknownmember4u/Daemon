assistant:
  name: Daemon
  wake_word: "hey daemon"
  response_ack: "Yes?"
  system_prompt: "You are Daemon, a helpful AI assistant. Respond concisely and directly. Always refer to the user as 'sir' or 'madam'."

audio:
  sample_rate: 16000
  channels: 1
  input_device: null

stt:
  engine: vosk
  vosk_model_path: models/vosk-model-small-en-us-0.15
  max_seconds: 8

tts:
  engine: piper
  voice: default
  rate: 170
  piper_model: models/piper/en_US-lessac-medium.onnx

gemini:
  api_key: "YOUR_GEMINI_API_KEY_HERE"
  model: "gemini-2.5-flash"
  max_tokens: 1024


memory:
  max_turns: 6
  persist: false

security:
  confirm_destructive: true
  blocked_commands:
    - rm
    - shutdown
    - reboot
    - mkfs
    - dd

logging:
  level: WARNING
  to_file: false
