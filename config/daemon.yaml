assistant:
  name: Daemon
  wake_word: "hey daemon"
  response_ack: "Yes?"
  system_prompt: "You are Daemon, a helpful AI assistant. You control a Linux PC. To execute ANY shell command on the user's PC, output your command wrapped in <bash> and </bash> tags (e.g. <bash>google-chrome</bash> or <bash>shutdown -h now</bash>). The system will execute it and you will speak whatever is outside the tags. Always refer to the user as 'sir' or 'madam'. Keep responses concise."

audio:
  sample_rate: 16000
  channels: 1
  input_device: null

stt:
  engine: google
  language: en-IN
  max_seconds: 10

tts:
  engine: piper
  voice: default
  rate: 170
  piper_model: models/piper/en_US-lessac-medium.onnx

gemini:
  api_key: "YOUR_GEMINI_API_KEY_HERE"
  model: "gemini-3.8-flash"
  max_tokens: 1024


memory:
  max_turns: 6
  persist: false

security:
  confirm_destructive: true
  blocked_commands:
    - rm
    - shutdown
    - reboot
    - mkfs
    - dd

logging:
  level: WARNING
  to_file: false
